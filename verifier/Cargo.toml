[package]
name = "zkm-wasm-verifier"
description = "A rust verifier for BN254 curve"
keywords = ["zero-knowledge", "cryptography", "zkSNARK", "SNARK", "gnark"]
categories = ["cryptography"]
readme = "README.md"
include = ["Cargo.toml", "src", "README.md"]
edition = "2021"
version = "1.0.0"

[dependencies]
zkm-verifier.workspace = true
wasm-bindgen = "0.2"

# getrandom 0.2 (pulled in transitively via rand_core 0.6) refuses to compile on
# wasm32-unknown-unknown unless its "js" feature is enabled.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

# This is necessary for the wasm-bindgen.
[lib]
crate-type = ["cdylib", "rlib"]
